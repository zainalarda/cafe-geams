<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنسان حيوان نبات - تحدي الطاولة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background-color:#0b0f19;color:white;margin:0;padding:0}
.glass-panel{background:rgba(20,27,45,0.75);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08)}
.hidden{display:none !important}
</style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center justify-center">
    <div class="w-full max-w-2xl space-y-5">
        <header class="text-center space-y-2">
            <div class="flex items-center justify-between">
                <a id="backGamesLink" href="/games.html" class="inline-flex items-center gap-1.5 text-xs text-amber-300 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl font-bold transition border border-slate-700">
                    <i class="fas fa-gamepad"></i> بوابة الألعاب
                </a>
                <span class="text-xs text-gray-500 font-mono">طاولة الكافيه</span>
            </div>
            <h1 class="text-3xl font-black text-emerald-400">🌿 إنسان • حيوان • نبات</h1>
            <p class="text-gray-400 text-sm">التحدي اللغوي الشهير بين الأصدقاء في المقهى</p>
            <div id="tableBadge" class="hidden text-xs bg-slate-800 text-emerald-300 font-bold px-3 py-1 rounded-full inline-block border border-slate-700"></div>
        </header>

        <!-- بطاقة التحقق من كلمة سر الطاولة -->
        <div id="authCard" class="glass-panel p-6 rounded-2xl border-2 border-emerald-500/40 text-center space-y-4 shadow-xl">
            <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold">
                🔒
            </div>
            <h2 class="text-xl font-bold text-white">كلمة سر الطاولة مطلوبة</h2>
            <p class="text-xs text-gray-400">أدخل كلمة سر الطاولة المعتمدة للعبة إنسان حيوان نبات</p>
            <div class="max-w-xs mx-auto">
                <input id="htnsCodeInp" type="text" dir="ltr" maxlength="12" placeholder="كلمة السر" class="w-full bg-slate-800 border border-slate-600 focus:border-emerald-500 rounded-xl px-4 py-2.5 text-white font-mono uppercase text-center font-bold tracking-widest text-base focus:outline-none">
            </div>
            <div id="authErr" class="text-xs text-red-400 hidden bg-red-950/50 p-2.5 rounded-xl border border-red-800 font-bold"></div>
            <button id="authBtn" class="w-full max-w-xs mx-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition">
                تأكيد وبدء اللعبة 🚀
            </button>
        </div>

        <!-- ساحة اللعب بعد التحقق -->
        <div id="gameplayBox" class="space-y-5 hidden">
            <!-- صندوق الحرف والمؤقت -->
            <div class="glass-panel p-6 rounded-2xl border border-slate-700 text-center space-y-4 shadow-xl">
                <div class="flex justify-around items-center">
                    <div>
                        <span class="text-xs text-gray-400 font-bold block mb-1">الحرف المختار:</span>
                        <div id="letterBox" class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 font-black text-4xl rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto">
                            ؟
                        </div>
                    </div>
                    <div>
                        <span class="text-xs text-gray-400 font-bold block mb-1">الوقت المتبقي:</span>
                        <div id="timerBox" class="text-4xl font-black text-yellow-400 font-mono">
                            60
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 justify-center">
                    <button id="spinBtn" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg transition">
                        🎲 سحب حرف جديد
                    </button>
                    <button id="finishBtn" class="bg-red-600 hover:bg-red-500 px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg transition" disabled>
                        🛑 أتوبيس كومبليت!
                    </button>
                </div>
            </div>

            <!-- حقول الإدخال -->
            <div class="glass-panel p-6 rounded-2xl border border-slate-700 space-y-3 shadow-xl">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">اسم إنسان (ولد أو بنت)</label>
                    <input id="f_human" type="text" placeholder="اكتب اسماً يبدأ بالحرف…" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">حيوان</label>
                    <input id="f_animal" type="text" placeholder="اكتب اسم حيوان…" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">نبات (خضار، فواكه، شجر)</label>
                    <input id="f_plant" type="text" placeholder="اكتب اسم نبات…" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">جماد</label>
                    <input id="f_thing" type="text" placeholder="اكتب اسم جماد…" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">بلاد أو عاصمة</label>
                    <input id="f_city" type="text" placeholder="اكتب اسم دولة أو مدينة…" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>
        </div>

        <!-- ملخص النتيجة والجوائز -->
        <div id="resultBox" class="glass-panel p-5 rounded-2xl border border-slate-700 text-center space-y-3 hidden">
            <h2 class="text-xl font-bold text-yellow-400">انتهت الجولة!</h2>
            <p id="scoreSummary" class="text-sm font-bold text-white"></p>
            <div id="prizeContainer"></div>
            <div class="flex gap-2 justify-center pt-2">
                <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-xl font-bold text-sm">
                    جولة جديدة
                </button>
                <a id="resBackLink" href="/games.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold text-sm">
                    بوابة الألعاب 🎮
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { openTable, recordResult, prizeHtml, GAMES } from './core.js';

        const LETTERS = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];
        let currentLetter = null;
        let timer = null;
        let timeLeft = 60;
        let tableData = null;

        const P = new URLSearchParams(location.search);
        const urlCode = P.get('code');
        if (urlCode) {
            document.getElementById('htnsCodeInp').value = urlCode;
            tryOpen(urlCode);
        }

        async function tryOpen(code) {
            const errEl = document.getElementById('authErr');
            errEl.classList.add('hidden');
            const res = await openTable(code, 'htns');
            if (res.error) {
                errEl.textContent = res.error;
                errEl.classList.remove('hidden');
                return;
            }
            tableData = res.data;
            const link = `/games.html?code=${encodeURIComponent(code)}`;
            const bLink = document.getElementById('backGamesLink');
            if (bLink) bLink.href = link;
            const rLink = document.getElementById('resBackLink');
            if (rLink) rLink.href = link;
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('gameplayBox').classList.remove('hidden');
            const b = document.getElementById('tableBadge');
            b.textContent = `طاولة ${tableData.tableId || 1} • متصل ✓`;
            b.classList.remove('hidden');
        }

        document.getElementById('authBtn').onclick = () => {
            const code = document.getElementById('htnsCodeInp').value.trim();
            if (!code) {
                document.getElementById('authErr').textContent = 'يرجى كتابة كلمة السر أولاً.';
                document.getElementById('authErr').classList.remove('hidden');
                return;
            }
            tryOpen(code);
        };

        const letterBox = document.getElementById('letterBox');
        const timerBox = document.getElementById('timerBox');
        const spinBtn = document.getElementById('spinBtn');
        const finishBtn = document.getElementById('finishBtn');

        spinBtn.onclick = () => {
            currentLetter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
            letterBox.textContent = currentLetter;
            finishBtn.disabled = false;
            spinBtn.disabled = true;

            timeLeft = 60;
            timerBox.textContent = timeLeft;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                timerBox.textContent = timeLeft;
                if (timeLeft <= 0) finishRound();
            }, 1000);
        };

        finishBtn.onclick = () => finishRound();

        async function finishRound() {
            clearInterval(timer);
            finishBtn.disabled = true;

            const fields = ['f_human', 'f_animal', 'f_plant', 'f_thing', 'f_city'];
            let filled = 0;
            fields.forEach(id => {
                const val = document.getElementById(id).value.trim();
                if (val.length > 1) filled += 10;
            });

            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('scoreSummary').textContent = `جمعت ${filled} نقطة في هذه الجولة بحرف (${currentLetter})!`;

            if (tableData && tableData.cafeId) {
                const p = await recordResult({
                    cafeId: tableData.cafeId,
                    game: GAMES.htns,
                    name: 'لاعب طاولة ' + (tableData.tableId || 1),
                    score: filled,
                    win: filled >= 40
                });
                if (p) document.getElementById('prizeContainer').innerHTML = prizeHtml(p, tableData.cafeId);
            }
        }
    </script>
</body>
</html>
